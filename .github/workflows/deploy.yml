name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/sellmmo/sellermmo
            git reset --hard
            git pull origin main
            docker compose build
            docker compose up -d
            docker exec sellmmo-app php artisan migrate --force
            docker exec sellmmo-app php artisan optimize:clear
            docker restart sellmmo-nginx
